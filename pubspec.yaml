name: fastlottie
description: "Faster than native — the Lottie renderer Flutter deserves. High-performance 2D Lottie (.json) and Telegram sticker (.tgs) renderer for Flutter."
version: 1.0.0
repository: https://github.com/definev/fastlottie
issue_tracker: https://github.com/definev/fastlottie/issues

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.1"

dependencies:
  archive: ^4.6.0
  code_assets: ^2.2.0
  data_assets: ^0.20.0
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  hooks: ^2.2.0
  native_toolchain_c: ^0.19.6
  meta: ^1.19.0
  web: ^1.1.1

flutter:
  assets:
    - path: lib/src/wasm/fastlottie_simd_v2.wasm
      platforms: [web]
    - path: lib/src/wasm/fastlottie_worker_v5.js
      platforms: [web]

dev_dependencies:
  crypto: ^3.0.8
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  lottie: 3.8.2
